version: '3.8'

services:
  nexmeet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
    volumes:
      # Yüklenen dosyalar container dışında kalıcı olarak saklanır
      - nexmeet_uploads:/app/uploads
    env_file:
      - ../.env

volumes:
  nexmeet_uploads:
